[package]
name = "configura"
description = "Configuration file logic for any Rust project"
version = "2.0.0"
authors = ["DarkCeptor44"]
edition = "2021"
rust-version = "1.78"
license = "MIT"
keywords = ["config", "settings", "load", "save", "configuration"]
categories = ["development-tools", "config"]
repository = "https://github.com/DarkCeptor44/handy-rs"
homepage = "https://github.com/DarkCeptor44/handy-rs/tree/master/configura"

[features]
default = ["json"]
full = ["json", "toml", "yaml"]

json = ["dep:serde_json"]
toml = ["dep:toml"]
yaml = ["dep:serde_yml"]

[dependencies]
dirs = "^6"
serde = { version = "^1", features = ["derive"] }
thiserror = "^2"

serde_json = { version = "^1", optional = true }
serde_yml = { version = "^0.0", optional = true }
toml = { version = "^0.9", optional = true }

[dev-dependencies]
divan = "^0.1"
tempfile = "^3"

[package.metadata.docs.rs]
all-features = true

[package.metadata.playground]
features = ["full"]
